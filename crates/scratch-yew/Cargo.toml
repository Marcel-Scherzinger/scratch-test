[package]
name = "scratch-yew"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
gloo = "0.11.0"
gloo-file = "0.3.0"
js-sys = "0.3.81"
log = "0.4.28"
wasm-bindgen-futures = "0.4.54"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.81", features = ["DataTransfer"] }
yew = { version = "0.21.0", features = ["csr"] }
yew-router = "0.18.0"

# see .cargo/config.toml for RUSTFLAGS, needed for randoms in webassembly
getrandom = { version = "0.3", features = ["wasm_js"] }

model = { path = "../model" }
interpreter = { path = "../interpreter" }
testdata = { path = "../testdata" }
testreports = { path = "../testreports" }
derive_more = { version = "2.0.1", features = ["display"] }

